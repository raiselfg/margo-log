[project]
name = "margo-love-back"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "aiogram>=3,<4",
    "fastapi>=0.143.1",
    "psycopg[binary]>=3.3,<4",
    "pydantic-settings>=2.16.0",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]

[tool.vercel]
entrypoint = "app.main:app"
